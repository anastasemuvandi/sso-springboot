# GoRSSO email messages, English. Every value goes through java.text.MessageFormat:
# write an apostrophe as '' and never use a literal { } (only {0}..{4} placeholders).
#   password-reset / email-verification: {0}=link {1}=expiry(min) {2}=realm {3}=formatted expiry
#   executeActions: {0}=link {1}=expiry(min) {2}=realm {3}=required actions {4}=formatted expiry

emailBrandTitle=Government of Rwanda
emailBrandSubtitle=Single Sign-On - SSO.RISA
emailFooter=This message was sent by the Government of Rwanda Single Sign-On service (SSO.RISA, Rwanda Information Society Authority). Never share this link. If you did not expect this email, you can ignore it: nothing changes unless the link is used.

passwordResetSubject=Reset your Government of Rwanda SSO password
passwordResetBody=Someone asked to reset the password of your {2} account. If this was you, open the link below to choose a new password:\n\n{0}\n\nThis link expires in {3}.\n\nIf you did not ask for this, ignore this message. Your password stays the same.
passwordResetBodyHtml=<p>Someone asked to reset the password of your <strong>{2}</strong> account. If this was you, choose a new password:</p><p><a href="{0}" style="display:inline-block;background:#1e88e5;color:#ffffff;text-decoration:none;padding:10px 18px;border-radius:8px;font-weight:600;">Choose a new password</a></p><p style="font-size:12px;color:#64748b;">Or copy this link into your browser: <br><a href="{0}">{0}</a></p><p>This link expires in {3}.</p><p>If you did not ask for this, ignore this message. Your password stays the same.</p>

executeActionsSubject=Action required on your Government of Rwanda SSO account
executeActionsBody=Your administrator asks you to complete the following on your {2} account: {3}.\n\nOpen this link to start:\n\n{0}\n\nThis link expires in {4}.\n\nIf you do not recognise this request, ignore this message.
executeActionsBodyHtml=<p>Your administrator asks you to complete the following on your <strong>{2}</strong> account:</p><p><strong>{3}</strong></p><p><a href="{0}" style="display:inline-block;background:#1e88e5;color:#ffffff;text-decoration:none;padding:10px 18px;border-radius:8px;font-weight:600;">Start now</a></p><p style="font-size:12px;color:#64748b;">Or copy this link into your browser: <br><a href="{0}">{0}</a></p><p>This link expires in {4}.</p><p>If you do not recognise this request, ignore this message.</p>

emailVerificationSubject=Confirm your email address
emailVerificationBody=Please confirm that this email address belongs to your {2} account by opening the link below:\n\n{0}\n\nThis link expires in {3}.\n\nIf you did not create this account, ignore this message.
emailVerificationBodyHtml=<p>Please confirm that this email address belongs to your <strong>{2}</strong> account.</p><p><a href="{0}" style="display:inline-block;background:#1e88e5;color:#ffffff;text-decoration:none;padding:10px 18px;border-radius:8px;font-weight:600;">Confirm email address</a></p><p style="font-size:12px;color:#64748b;">Or copy this link into your browser: <br><a href="{0}">{0}</a></p><p>This link expires in {3}.</p><p>If you did not create this account, ignore this message.</p>

requiredAction.UPDATE_PASSWORD=Set your password
