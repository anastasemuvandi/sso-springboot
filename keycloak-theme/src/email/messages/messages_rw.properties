emailBrandTitle=Guverinoma y''u Rwanda
emailBrandSubtitle=Kwinjira rimwe gusa - SSO.RISA
emailFooter=Ubu butumwa bwoherejwe na serivisi yo kwinjira rimwe gusa ya Guverinoma y''u Rwanda (SSO.RISA, Rwanda Information Society Authority). Ntuzigere uha undi iyi link. Niba utari utegereje ubu butumwa, ushobora kubwirengagiza: nta gihinduka keretse link ikoreshejwe.

passwordResetSubject=Hindura ijambo ry''ibanga rya konti yawe ya GoR SSO
passwordResetBody=Hari uwasabye guhindura ijambo ry''ibanga rya konti yawe ya {2}. Niba ari wowe, fungura iyi link uhitemo ijambo ry''ibanga rishya:\n\n{0}\n\nIyi link izarangira mu {3}.\n\nNiba atari wowe wabisabye, wirengagize ubu butumwa. Ijambo ry''ibanga ryawe ntirihinduka.
passwordResetBodyHtml=<p>Hari uwasabye guhindura ijambo ry''ibanga rya konti yawe ya <strong>{2}</strong>. Niba ari wowe, hitamo ijambo ry''ibanga rishya:</p><p><a href="{0}" style="display:inline-block;background:#1e88e5;color:#ffffff;text-decoration:none;padding:10px 18px;border-radius:8px;font-weight:600;">Hitamo ijambo ry''ibanga rishya</a></p><p style="font-size:12px;color:#64748b;">Cyangwa wandukure iyi link uyishyire muri mushakisha: <br><a href="{0}">{0}</a></p><p>Iyi link izarangira mu {3}.</p><p>Niba atari wowe wabisabye, wirengagize ubu butumwa. Ijambo ry''ibanga ryawe ntirihinduka.</p>

executeActionsSubject=Hari igikorwa gisabwa kuri konti yawe ya GoR SSO
executeActionsBody=Umuyobozi wawe agusaba kurangiza ibi bikurikira kuri konti yawe ya {2}: {3}.\n\nFungura iyi link kugira ngo utangire:\n\n{0}\n\nIyi link izarangira mu {4}.\n\nNiba utazi iki cyifuzo, wirengagize ubu butumwa.
executeActionsBodyHtml=<p>Umuyobozi wawe agusaba kurangiza ibi bikurikira kuri konti yawe ya <strong>{2}</strong>:</p><p><strong>{3}</strong></p><p><a href="{0}" style="display:inline-block;background:#1e88e5;color:#ffffff;text-decoration:none;padding:10px 18px;border-radius:8px;font-weight:600;">Tangira</a></p><p style="font-size:12px;color:#64748b;">Cyangwa wandukure iyi link uyishyire muri mushakisha: <br><a href="{0}">{0}</a></p><p>Iyi link izarangira mu {4}.</p><p>Niba utazi iki cyifuzo, wirengagize ubu butumwa.</p>

