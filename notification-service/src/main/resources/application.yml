server:
  port: ${PORT:8002}
  shutdown: graceful

spring:
  application:
    name: notification-service
  datasource:
    # NOTIFICATION_DATABASE_URL in the reference's SQLAlchemy form
    # (postgresql+asyncpg://user:pass@host:5432/db) is also accepted: it is translated
    # into these three properties at startup (SecretFileEnvironmentPostProcessor).
    url: ${NOTIFICATION_DATABASE_JDBC_URL:jdbc:postgresql://postgres:5432/notifications}
    username: ${NOTIFICATION_DATABASE_USER:postgres}
    password: ${NOTIFICATION_DATABASE_PASSWORD:postgres}
  flyway:
    enabled: true
  thymeleaf:
    check-template-location: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: false

notification:
  api-key: ${NOTIFICATION_API_KEY:change-me-in-production}
  # Fail startup on a missing/default secret. Forced on by the staging/prod profiles.
  require-secrets: ${NOTIFICATION_REQUIRE_SECRETS:false}
  admin-emails: ${ADMIN_EMAILS:${ADMIN_EMAILS_RAW:}}
  webhook-url: ${WEBHOOK_URL:}
  timezone-offset-hours: ${TIMEZONE_OFFSET_HOURS:2}
  business-start-hour: ${BUSINESS_START_HOUR:6}
  business-end-hour: ${BUSINESS_END_HOUR:22}
  critical-cooldown-minutes: ${CRITICAL_COOLDOWN_MINUTES:5}
  warning-cooldown-minutes: ${WARNING_COOLDOWN_MINUTES:60}
  audit:
    base-url: ${AUDIT_SERVICE_URL:http://audit-service:8001}
    api-key: ${AUDIT_API_KEY:change-me-in-production}
    page-size: ${AUDIT_PAGE_SIZE:1000}
    max-pages: ${AUDIT_MAX_PAGES:20}
    timeout-seconds: ${AUDIT_TIMEOUT_SECONDS:15}
  smtp:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    user: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    from: ${SMTP_FROM:sso-alerts@gov.rw}
    use-tls: ${SMTP_USE_TLS:true}
    timeout-seconds: ${SMTP_TIMEOUT_SECONDS:10}
  detector:
    enabled: ${DETECTOR_ENABLED:true}
    interval-ms: ${DETECTOR_INTERVAL_MS:60000}
    initial-lookback-minutes: ${DETECTOR_INITIAL_LOOKBACK_MINUTES:60}
    overlap-minutes: ${DETECTOR_OVERLAP_MINUTES:2}
    settle-seconds: ${DETECTOR_SETTLE_SECONDS:2}
  report:
    enabled: ${DAILY_REPORT_ENABLED:true}
    cron: ${DAILY_REPORT_CRON:0 0 8 * * *}
    zone: ${DAILY_REPORT_ZONE:Africa/Kigali}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /docs

logging:
  level:
    root: ${LOG_LEVEL:INFO}

---
spring:
  config:
    activate:
      on-profile: "staging | prod"
notification:
  require-secrets: true
